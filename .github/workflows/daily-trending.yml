name: Daily GitHub Trending Summary

on:
  schedule:
    # 08:00 UTC every day. Adjust to taste.
    - cron: "0 8 * * *"
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  contents: write          # needed to commit the generated digest

jobs:
  trending:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch trending repos
        run: python src/fetch_trending.py

      - name: Summarize with Claude Code
        uses: anthropic/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt_file: prompts/summarize.md

      - name: Commit and push digest
        run: |
          date="$(date -u +%F)"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archive/ data/ README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Trending digest for ${date}"
            git push
          fi
